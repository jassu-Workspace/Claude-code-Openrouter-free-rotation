<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Free Claude Code — Dashboard</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/admin/assets/admin.css" />
  </head>
  <body>
    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">Free Claude Code</span>
            <span class="brand-sub">Dashboard</span>
          </div>
        </div>
        <nav class="nav" id="mainNav" aria-label="Main navigation"></nav>
        <div class="sidebar-footer">
          <div class="status-dot" id="serverStatusDot"></div>
          <span id="serverStatusText">Connecting…</span>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="content">
        <header class="topbar">
          <div class="topbar-left">
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 class="topbar-title" id="pageTitle">Overview</h1>
          </div>
          <div class="topbar-right">
            <span class="uptime-badge" id="uptimeBadge"></span>
          </div>
        </header>

        <div class="views" id="viewsContainer"></div>
      </main>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/admin/assets/admin.js"></script>
  </body>
</html>
