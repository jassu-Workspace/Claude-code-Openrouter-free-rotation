<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Free Claude Code Admin</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/admin/assets/admin.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">FC</div>
          <div>
            <h1>Free Claude Code</h1>
            <p>Server Control</p>
          </div>
        </div>
        <nav id="sectionNav" class="section-nav" aria-label="Admin views"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h2 id="pageTitle">Providers</h2>
          </div>
        </header>

        <div id="adminViews" class="admin-views">
          <section id="view-providers" class="admin-view active" data-view="providers">
            <section class="provider-strip" aria-label="Provider status">
              <div class="strip-header">
                <h3>Providers</h3>
              </div>
              <div id="providerGrid" class="provider-grid"></div>
            </section>
            <div
              id="providersSections"
              class="form-sections"
              aria-label="Provider configuration"
            ></div>
          </section>

          <section id="view-model_config" class="admin-view" data-view="model_config" hidden>
            <div
              id="modelConfigSections"
              class="form-sections"
              aria-label="Model configuration"
            ></div>
          </section>

          <section id="view-messaging" class="admin-view" data-view="messaging" hidden>
            <div
              id="messagingSections"
              class="form-sections"
              aria-label="Messaging configuration"
            ></div>
          </section>

          <section id="view-keys" class="admin-view" data-view="keys" hidden>
            <div id="keysSections" style="display:none"></div>
            <div class="form-sections" aria-label="Key Status">
              <section class="form-section">
                <div class="section-header">
                  <h3>OpenRouter Key Status</h3>
                  <p>Real-time status of your rotating API keys.</p>
                </div>
                <div class="section-content">
                  <div class="field-row">
                    <div class="field-info">
                      <label>Total Keys</label>
                      <div class="field-desc">Number of keys configured.</div>
                    </div>
                    <div class="field-control">
                      <div id="key-stat-total" class="stat-value">0</div>
                    </div>
                  </div>
                  <div class="field-row">
                    <div class="field-info">
                      <label>Active (Healthy) Keys</label>
                      <div class="field-desc">Keys currently available for use.</div>
                    </div>
                    <div class="field-control">
                      <div id="key-stat-healthy" class="stat-value" style="color: #4ade80;">0</div>
                    </div>
                  </div>
                  <div class="field-row">
                    <div class="field-info">
                      <label>Exhausted Keys</label>
                      <div class="field-desc">Keys that hit rate limits or zero balance.</div>
                    </div>
                    <div class="field-control">
                      <div id="key-stat-exhausted" class="stat-value" style="color: #f87171;">0</div>
                    </div>
                  </div>
                  <div class="field-row">
                    <div class="field-info">
                      <label>Current Key Index</label>
                      <div class="field-desc">Which key is currently being used.</div>
                    </div>
                    <div class="field-control">
                      <div id="key-stat-current" class="stat-value">0</div>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          </section>
        </div>
      </main>

      <footer class="action-bar">
        <div class="action-meta">
          <strong id="dirtyState">No changes</strong>
          <span id="configPath"></span>
        </div>
        <div id="messageArea" class="message-area"></div>
        <div class="action-buttons">
          <button id="validateButton" class="secondary-button" type="button">Validate</button>
          <button id="applyButton" class="primary-button" type="button" disabled>Apply</button>
        </div>
      </footer>
    </div>
    <script src="/admin/assets/admin.js"></script>
  </body>
</html>
